<!DOCTYPE html>
<html lang="vi" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khoá luyện thi OPIc — hướng dẫn, script mẫu và công cụ luyện nói</title>
<meta name="description" content="Luyện nói OPIc theo script: hướng dẫn chọn survey, cấu trúc 15 câu, 7 dạng câu hỏi, 185 script mẫu chia theo chủ đề, máy đọc, chế độ gợi ý, đồng hồ, ghi âm, luyện thẻ lặp lại ngắt quãng và thi thử 15 câu.">
<meta name="color-scheme" content="light dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b45309'/%3E%3Cg stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='12' y='6' width='8' height='13' rx='4'/%3E%3Cpath d='M8 15a8 8 0 0 0 16 0M16 23v4M12 27h8'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>

<!-- ===================== SPRITE ICON =====================
     Dùng <symbol viewBox="0 0 24 24">, KHÔNG dùng <g>: thiếu viewBox thì
     trình duyệt vẽ hệ toạ độ 24×24 ở tỉ lệ 1:1 rồi cắt bớt. -->
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5v14M17 5v14"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M9 21h6"/></symbol>
<symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 016.5 2H20v16H6.5A2.5 2.5 0 004 20.5z"/><path d="M4 17.5A2.5 2.5 0 016.5 15H20"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 17V10M12 17V5M17 17v-7"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="M4 4h16v12l-4 4H4z"/><path d="M20 16h-4v4"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.3A10 10 0 0112 6c6.5 0 10 6 10 6a16 16 0 01-3.2 3.7M6.6 6.6A16 16 0 002 12s3.5 6 10 6a10 10 0 004.3-1"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 19h16"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 19h16"/></symbol>
<symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 7h7l-3-3M21 7l-3 3M21 17l-3-3M21 17l-3 3"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
<symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M20 13v7a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1h7"/></symbol>
<symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 5v14l9-7z"/><path d="M18 5v14"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l11-11-4-4L4 16z"/><path d="M13 7l4 4"/></symbol>
</defs></svg>

<!-- ===================== HEADER ===================== -->
<header class="hdr">
  <button class="ic-btn only-nar" id="btnMenu" aria-label="Mở mục lục"><svg class="ic"><use href="#i-menu"/></svg></button>

  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><g stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="6" width="8" height="13" rx="4"/><path d="M8 15a8 8 0 0 0 16 0M16 23v4M12 27h8"/></g></svg>
    </span>
    <span class="brand-txt">
      <b>Luyện thi OPIc</b>
      <i>hướng dẫn · script · luyện nói</i>
    </span>
  </a>

  <button class="searchpill" id="btnSearch">
    <svg class="ic"><use href="#i-search"/></svg>
    <span>Tìm câu hỏi, script, hướng dẫn…</span>
    <kbd>Ctrl K</kbd>
  </button>

  <div class="hdr-right">
    <a class="hdr-prog" href="#/tien-do" title="Số script đã thuộc">
      <svg viewBox="0 0 36 36" class="ring" aria-hidden="true">
        <circle class="ring-bg" cx="18" cy="18" r="15.5"/>
        <circle class="ring-fg" id="hdrRing" cx="18" cy="18" r="15.5"/>
      </svg>
      <span id="hdrPct">0%</span>
    </a>
    <button class="ic-btn" id="btnTheme" aria-label="Đổi giao diện sáng/tối">
      <svg class="ic ic-sun"><use href="#i-sun"/></svg>
      <svg class="ic ic-moon"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<!-- ===================== LAYOUT ===================== -->
<div class="shell">
  <aside class="side" id="side" aria-label="Mục lục"><div class="side-in" id="sideNav"></div></aside>
  <div class="scrim" id="scrim"></div>
  <main id="main" tabindex="-1"></main>
</div>

<!-- ===================== SEARCH ===================== -->
<div class="ovl" id="ovl" hidden>
  <div class="srch" role="dialog" aria-modal="true" aria-label="Tìm kiếm">
    <div class="srch-top">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Nhập từ khoá… (ví dụ: park, nha cua, role play, so sanh)" autocomplete="off" spellcheck="false">
      <button class="ic-btn" id="btnCloseSrch" aria-label="Đóng"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="srch-res" id="res"></div>
    <div class="srch-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> di chuyển</span>
      <span><kbd>↵</kbd> mở</span>
      <span><kbd>Esc</kbd> đóng</span>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/logic.js"></script>     <!-- logic thuần, không DOM — kiem-nhanh.js cũng nạp -->
<script src="assets/app.js"></script>       <!-- giao diện; nội dung tải từ API /courses/opic/bundle -->
</body>
</html>
