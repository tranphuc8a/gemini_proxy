<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý khoá học</title>
<meta name="description" content="Quản lý nội dung khoá học trong database: tạo, nạp, xuất, xuất bản, sửa mục lục và bài giảng.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/hien-thi.css">   <!-- kiểu chữ bài đọc — CÙNG tệp với trang khoá học (engine/sync.py chép) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cg stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round'%3E%3Cpath d='M9 10h14M9 16h14M9 22h9'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>

<header class="hdr">
  <button type="button" class="btn sm only-nar" id="btnDs" aria-label="Danh sách khoá học">☰</button>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">QL</span>
    <span class="brand-txt"><b>Quản lý khoá học</b><i id="apiInfo">…</i></span>
  </div>
  <div class="hdr-right">
    <a class="btn sm" href="../khoa-hoc/" target="_blank" rel="noopener" title="Thư viện khoá học — trang đọc mọi khoá">Thư viện ↗</a>
    <span class="sess" id="sessInfo"></span>
    <button type="button" class="btn sm" id="btnTheme" aria-label="Đổi giao diện sáng / tối">◐</button>
    <button type="button" class="btn sm" id="btnLock" hidden>Khoá lại</button>
  </div>
</header>

<!-- Đăng nhập: khoá quản trị đổi lấy token phiên; trình duyệt KHÔNG giữ khoá.
     Hết phiên giữa chừng thì hiện đè lên ứng dụng (lớp "phu"), thay đổi chưa lưu vẫn còn. -->
<section class="login" id="login" hidden>
  <div class="card" role="dialog" aria-labelledby="loginT">
    <h1 id="loginT">Mở khoá quản trị</h1>
    <p class="muted">Nhập <code>COURSE_ADMIN_KEY</code> của backend. Khoá được đổi lấy một token phiên có hạn;
      trình duyệt chỉ giữ token, không giữ khoá. Xem nội dung công khai thì không cần đăng nhập.</p>
    <form id="frmLogin" class="row">
      <input type="password" id="inpKey" placeholder="Khoá quản trị" autocomplete="current-password" required aria-label="Khoá quản trị">
      <button class="btn pri" type="submit">Mở khoá</button>
    </form>
    <p class="err" id="loginErr" role="alert" hidden></p>
  </div>
</section>

<div class="shell" id="app" hidden>
  <aside class="side" id="side" aria-label="Danh sách khoá học">
    <div class="side-h">
      <b>Khoá học</b>
      <span class="sp"></span>
      <button type="button" class="btn sm" id="btnReload" title="Tải lại danh sách" aria-label="Tải lại danh sách">↻</button>
    </div>
    <div class="side-act">
      <button type="button" class="btn sm pri" id="btnNew">＋ Khoá mới</button>
      <button type="button" class="btn sm" id="btnSoanAI" title="AI lập dàn ý từ chủ đề / tài liệu rồi soạn từng bài thành khoá nháp">✨ Soạn bằng AI</button>
      <label class="btn sm" for="inpImport" tabindex="0">Nạp bundle JSON</label>
      <input type="file" id="inpImport" accept="application/json,.json" hidden>
      <button type="button" class="btn sm" id="btnTrash" title="Khoá và bài đã xoá (giữ 30 ngày)">🗑 Thùng rác</button>
      <button type="button" class="btn sm" id="btnAI" title="Lượt dùng AI, token và hạn mức theo ngày">🤖 AI</button>
    </div>
    <div id="locKhoaBox" hidden><input type="search" id="locKhoa" placeholder="Lọc khoá học…" aria-label="Lọc khoá học"></div>
    <ul class="clist" id="courseList"></ul>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js" integrity="sha384-QsSpx6a0USazT7nK7w8qXDgpSAPhFsb2XtpoLFQ5+X2yFN6hvCKnwEzN8M5FWaJb" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
<script src="assets/hien-thi.js"></script>   <!-- dựng bài từ markdown — CÙNG bộ với trang đọc -->
<script src="assets/app.js"></script>        <!-- lõi: phiên, API, hộp thoại, danh sách, thông tin, thùng rác -->
<script src="assets/cay.js"></script>        <!-- cây mục lục kéo-thả -->
<script src="assets/soan.js"></script>       <!-- trình soạn bài -->
<script src="assets/tep.js"></script>        <!-- tệp + kiểm tra liên kết -->
<script src="assets/soan-ai.js"></script>    <!-- soạn khoá bằng AI: dàn ý → từng bài → khoá nháp -->
</body>
</html>
