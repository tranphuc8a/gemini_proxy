<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cờ tướng mỗi ngày</title>
<meta name="description" content="Mỗi ngày một ván của kỳ thủ: đoán 8 nước đi của họ, có gợi ý và engine Wukong, giữ chuỗi ngày chơi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fffdf9' stroke='%23a8331d' stroke-width='3'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23a8331d' font-family='serif'%3E%E5%B8%A5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="game/daily.css">
</head>
<body>
<header class="dau">
  <a class="ve" href="../../../index.html">← Wukong</a>
  <div class="ten"><b>Cờ tướng mỗi ngày</b><span id="ngay">…</span></div>
  <button type="button" class="nut nho" id="btnAm" aria-pressed="true" title="Bật / tắt tiếng">🔈</button>
</header>

<main class="khung">
  <section class="ban-hop">
    <div class="ban" id="ban" role="group" aria-label="Bàn cờ"></div>
    <div class="duyet" id="duyet" hidden>
      <button type="button" class="nut nho" data-di="dau" aria-label="Về đầu ván">⏮</button>
      <button type="button" class="nut nho" data-di="lui" aria-label="Lùi một nước">◀</button>
      <span id="duyetSo">0 / 0</span>
      <button type="button" class="nut nho" data-di="toi" aria-label="Tới một nước">▶</button>
      <button type="button" class="nut nho" data-di="cuoi" aria-label="Tới cuối ván">⏭</button>
    </div>
  </section>

  <section class="ben">
    <div class="the" id="thongTin"></div>

    <div class="the choi" id="choi">
      <div class="vong"><b id="vongSo">Nước 1 / 8</b><span id="diem">0 điểm</span></div>
      <ol class="o-diem" id="oDiem" aria-label="Điểm từng nước"></ol>
      <p class="loi-nhan" id="loiNhan" aria-live="polite"></p>
      <div class="nut-hang">
        <button type="button" class="nut" id="btnGoiY">💡 Gợi ý quân <small>−1</small></button>
        <button type="button" class="nut" id="btnMay">🤖 Hỏi Wukong <small>−1</small></button>
      </div>
      <p class="luat">Đoán nước kỳ thủ đã đi: đúng ngay <b>3</b> điểm, lần hai <b>2</b>, sai cả hai <b>0</b>.
        Mỗi gợi ý trừ 1 điểm của nước đó.</p>
    </div>

    <div class="the ket" id="ket" hidden>
      <h2 id="ketTieuDe">Hoàn thành!</h2>
      <p class="ket-diem" id="ketDiem"></p>
      <pre class="ket-chia" id="ketChia"></pre>
      <div class="nut-hang">
        <button type="button" class="nut chinh" id="btnChia">📋 Chép kết quả</button>
        <a class="nut" id="lnkLuyen" href="?van=">🎲 Luyện ván khác</a>
      </div>
      <p class="goi-y" id="ketGhi"></p>
    </div>

    <div class="the chuoi" id="chuoi"></div>

    <div class="the">
      <b class="nhan">Diễn biến</b>
      <ol class="nuoc" id="nuoc"></ol>
    </div>
  </section>
</main>

<script src="../engine/wukong.js"></script>
<script src="game/games.js"></script>
<script src="game/daily.js"></script>
</body>
</html>
