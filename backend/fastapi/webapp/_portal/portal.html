<!-- Giao diện chọn TRƯỚC khi vẽ (không nhấp nháy sáng→tối): lựa chọn đã lưu; "hệ thống" hoặc chưa chọn thì theo hệ điều hành. -->
<script>
  (function () {
    var t = "system", p = null;
    try { p = JSON.parse(localStorage.getItem("portal:v2") || "null"); } catch (e) { /* chế độ riêng tư */ }
    if (p && p.settings && /^(light|dark)$/.test(p.settings.theme)) t = p.settings.theme;
    if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    if (p && p.settings && p.settings.density === "compact") document.documentElement.dataset.density = "compact";
  })();
</script>

<header class="topbar" id="topbar">
  <div class="topbar-row">
    <a class="brand" href="./portal.html" aria-label="Web Apps Portal — trang chủ">
      <span class="brand-mark"><svg class="ic ic-fill" aria-hidden="true"><use href="#i-logo"/></svg></span>

    <form class="search" role="search" id="searchForm" autocomplete="off">
      <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="200"
             placeholder="Tìm app, #tag, @thư-mục" aria-label="Tìm ứng dụng">
      <button type="button" class="icon-btn clear" id="clearQ" hidden aria-label="Xoá ô tìm kiếm"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </form>

    <div class="top-actions">
      <button type="button" class="btn btn-ghost btn-palette hide-sm" id="btnPalette" title="Tìm mọi thứ: ứng dụng, khoá học, bài học, lab — hoặc hỏi AI">
        <svg class="ic" aria-hidden="true"><use href="#i-sparkle"/></svg><span>Tìm mọi thứ</span><kbd>Ctrl K</kbd>
      </button>
      <button type="button" class="icon-btn" id="btnInstall" hidden aria-label="Cài đặt ứng dụng" title="Cài đặt về máy"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg></button>
      <button type="button" class="icon-btn" id="btnTheme" aria-label="Đổi giao diện"></button>
      <button type="button" class="icon-btn" id="btnMenu" aria-label="Cài đặt và tiện ích" aria-haspopup="dialog"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
    </div>
  </div>
  <nav class="tabs hide-sm" id="tabs" aria-label="Chế độ xem"></nav>

<!-- Ctrl+K: tìm mọi thứ (ứng dụng, khoá học, bài học, lab) hoặc hỏi AI -->
<div class="palette-scrim" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Tìm mọi thứ">
    <div class="palette-input">
      <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="paletteInput" type="text" enterkeyhint="go" autocomplete="off" autocapitalize="none" spellcheck="false"
             placeholder="Ứng dụng, khoá học, bài học, lab… hoặc gõ một câu hỏi" aria-label="Tìm mọi thứ"
             role="combobox" aria-controls="paletteList" aria-expanded="true" aria-autocomplete="list">
      <button type="button" class="icon-btn" id="paletteClose" aria-label="Đóng"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="palette-list" id="paletteList" role="listbox" aria-label="Kết quả"></div>
    <div class="palette-answer" id="paletteAnswer" hidden aria-live="polite"></div>
    <div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> chọn</span><span><kbd>Enter</kbd> mở</span><span><kbd>Esc</kbd> đóng</span></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
