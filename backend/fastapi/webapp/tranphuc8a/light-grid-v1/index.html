<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lights Grid Lab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
<h1>Lights Grid Lab</h1>

<div class="toolbar">
<input id="rows" type="number" min="1" value="5">
<input id="cols" type="number" min="1" value="5">
<button id="createBtn">Tạo lưới</button>

<label>Bật</label><input type="color" id="onColor" value="#22c55e">
<label>Tắt</label><input type="color" id="offColor" value="#9ca3af">

<select id="mode">
<option value="self">Self</option>
<option value="cross">Cross</option>
<option value="x">X</option>
<option value="neighbors8">8 Neighbors</option>
<option value="row">Whole Row</option>
<option value="column">Whole Column</option>
<option value="rowColumn">Row + Column</option>
<option value="checkerboard">Checkerboard</option>
<option value="knight">Knight</option>
<option value="manhattan">Manhattan</option>
<option value="square">Square</option>
</select>

<label>Radius</label>
<input id="radius" type="number" min="1" value="2" style="width:60px">

<button id="randomBtn">Random</button>
<button id="resetBtn">Reset</button>
<button id="undoBtn">Undo</button>
</div>

<div class="stats">
<span>Bước: <b id="moves">0</b></span>
<span>Ô bật: <b id="onCount">0</b></span>
</div>

<div id="grid"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
