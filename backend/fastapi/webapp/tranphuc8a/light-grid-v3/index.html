<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lights Grid Lab V3</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<h1>Lights Grid Lab V3</h1>

<div class="toolbar">
<input id="rows" type="number" value="8" min="1">
<input id="cols" type="number" value="8" min="1">
<button id="create">Tạo lưới</button>

<select id="mode">
<option value="cross">Cross</option>
<option value="self">Self</option>
<option value="x">X</option>
<option value="neighbors8">8 Neighbors</option>
<option value="row">Row</option>
<option value="column">Column</option>
<option value="rowColumn">Row+Column</option>
<option value="manhattan">Manhattan</option>
<option value="square">Square</option>
</select>

<input id="radius" type="number" value="2" min="1">
<input id="onColor" type="color" value="#22c55e">
<input id="offColor" type="color" value="#4b5563">

<button id="random">Random</button>
<button id="clear">Clear</button>
<button id="undo">Undo</button>
<button id="export">Export</button>
<button id="share">Share URL</button>
<button id="solve">Solve (Cross)</button>
</div>

<div class="stats">
<span>Bước: <b id="moves">0</b></span>
<span>Ô sáng: <b id="onCount">0</b></span>
<span>Rank: <b id="rank">-</b></span>
</div>

<div id="grid"></div>

<h3>Kết quả Solver</h3>
<pre id="solverOutput"></pre>

</div>
<script src="js/app.js"></script>
</body>
</html>
