<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mẫu thiết kế — tra nhanh, kèm khi nào ĐỪNG dùng</title>
<link rel="stylesheet" href="assets/kieu.css">
</head>
<body>

<header class="dau">
  <div class="hieu">
    <span class="bieu-tuong">◈</span>
    <div>
      <h1>Mẫu thiết kế</h1>
      <p class="phu">23 mẫu GoF + 4 mẫu hiện đại — mỗi mẫu kèm <b>khi nào ĐỪNG dùng</b></p>
    </div>
  </div>
  <div class="cong-cu">
    <button class="nut" id="nut-sang-toi" title="Sáng / tối">◑</button>
  </div>
</header>

<div class="loc">
  <input type="search" id="tim" placeholder="Tìm theo tên, ý định, hoặc vấn đề bạn đang gặp…"
         autocomplete="off" spellcheck="false">
  <div class="the-nhom" id="the-nhom"></div>
</div>

<p class="mach">
  Mẫu thiết kế <b>bị lạm dụng nhiều hơn bị dùng thiếu</b>. Phần
  <span class="nhan-khong">✘ Đừng dùng khi</span> của mỗi mẫu là phần đáng đọc
  trước — nó nói cái giá bạn phải trả.
</p>

<main id="danh-sach"></main>

<footer class="chan">
  <span id="dem-ket"></span>
  <span class="day"></span>
  <span class="phu">Bấm vào thẻ để mở · phím <kbd>/</kbd> để tìm</span>
</footer>

<script src="assets/mau.js"></script>
<script src="assets/trang.js"></script>
</body>
</html>
