<script>
  /* Giao diện chọn TRƯỚC khi vẽ (không nhấp nháy sáng→tối): lựa chọn đã lưu, hoặc theo hệ điều hành. */
  (function () {
    var t = "system", f = 16;
    try { var p = JSON.parse(localStorage.getItem("pw:prefs") || "null"); if (p) { if (/^(light|dark)$/.test(p.theme)) t = p.theme; if (p.font >= 13 && p.font <= 24) f = p.font; } } catch (e) { /* chế độ riêng tư */ }
    if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    document.documentElement.style.setProperty("--editor-font", f + "px");
    /* Android Chrome: bàn phím thu nhỏ khung nhìn để ô soạn không bị che. WebKit không biết khoá này và ghi lỗi, nên chỉ thêm cho Android. */
    if (/Android/.test(navigator.userAgent)) document.querySelector('meta[name="viewport"]').content += ", interactive-widget=resizes-content";
  })();
</script>
