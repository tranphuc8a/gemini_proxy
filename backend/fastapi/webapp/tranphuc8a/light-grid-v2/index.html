<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lights Grid Lab V2</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
<h1>Lights Grid Lab V2</h1>
<div class="panel">
<input id="rows" type="number" value="8" min="1">
<input id="cols" type="number" value="8" min="1">
<button id="create">Tạo lưới</button>
<select id="mode">
<option value="cross">Cross</option>
<option value="self">Self</option>
<option value="x">X</option>
<option value="neighbors8">8 Neighbors</option>
<option value="row">Row</option>
<option value="column">Column</option>
<option value="rowColumn">Row+Column</option>
</select>
<input id="radius" type="number" value="2" min="1">
<input type="color" id="onColor" value="#22c55e">
<input type="color" id="offColor" value="#6b7280">
<button id="random">Random</button>
<button id="clear">Clear</button>
<button id="undo">Undo</button>
<button id="exportBtn">Export</button>
<input type="file" id="importFile">
</div>
<div class="info">
<span>Bước: <b id="moves">0</b></span>
<span>Ô bật: <b id="onCount">0</b></span>
</div>
<div id="grid"></div>
</div>
<script src="js/app.js"></script>
</body></html>
